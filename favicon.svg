<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Subtle Inner Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Microphone Icon -->
  <g filter="url(#glow)">
    <!-- Mic Capsule -->
    <rect x="25" y="13" width="14" height="23" rx="7" fill="#FFFFFF"/>

    <!-- Mic Cradle Arc -->
    <path d="M19 26C19 33.18 24.82 39 32 39C39.18 39 45 33.18 45 26" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Mic Stand Stem -->
    <path d="M32 39V48" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Mic Stand Base -->
    <path d="M23 48H41" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
